<style>
/* Layout: coluna única e estreita, muito espaço em branco; o único elemento com cor forte é o mapa, desenhado nas cores do Google Maps. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f6f6f4; --ink:#111214; --muted:#6c6f75; --line:#e9e9e6;
  --cta:#111214; --cta-ink:#ffffff; --focus:#1a73e8; --accent:#1a73e8;
  --ok:#188038; --warn:#b06000; --bad:#d93025;
  --sans:"Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --surface:#16171a; --soft:#1b1c20; --ink:#f2f2f0; --muted:#9a9ca3; --line:#26272c;
  --cta:#f2f2f0; --cta-ink:#0e0f11; --focus:#8ab4f8; --accent:#8ab4f8;
  --ok:#81c995; --warn:#fdd663; --bad:#f28b82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#16171a; --soft:#1b1c20; --ink:#f2f2f0; --muted:#9a9ca3; --line:#26272c;
  --cta:#f2f2f0; --cta-ink:#0e0f11; --focus:#8ab4f8; --accent:#8ab4f8;
  --ok:#81c995; --warn:#fdd663; --bad:#f28b82; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.025em;line-height:1.1}
h1{font-size:clamp(2rem,7.5vw,2.6rem)}
h2{font-size:clamp(1.5rem,5.6vw,1.85rem)}
h3{font-size:1.05rem;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;align-items:center;justify-content:space-between;min-height:32px}
.mark{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem;letter-spacing:-.01em}
.mark i{width:8px;height:8px;border-radius:50%;background:#ea4335;display:block}
.back{background:none;border:0;color:var(--muted);font:500 .9rem var(--sans);cursor:pointer;padding:6px 0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.progress{height:2px;background:var(--line);overflow:hidden;margin-top:-12px}
.progress span{display:block;height:100%;width:0;background:var(--ink);transition:width .4s ease}

.screen{display:flex;flex-direction:column;gap:22px;animation:in .35s ease both}
.screen .head{display:flex;flex-direction:column;gap:10px}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.progress span{transition:none}}

/* ---- cartão do mapa: mundo próprio, sempre nas cores do Google Maps ---- */
.gm{background:#fff;color:#202124;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(60,64,67,.25),0 2px 8px rgba(60,64,67,.12);font-family:Roboto, Arial, var(--sans)}
.gm-search{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;margin:12px;padding:10px 14px;border-radius:24px;box-shadow:0 1px 3px rgba(60,64,67,.3);font-size:.92rem;color:#202124;background:#fff}
.gm-search svg{width:18px;height:18px;flex:none}
.gm-map{position:relative;height:200px;background:#eef0f2}
.gm-map canvas{width:100%;height:100%;display:block}
.gm-list{display:flex;flex-direction:column}
.gm-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 16px;border-top:1px solid #e8eaed;align-items:center}
.gm-row .nm{font-size:.98rem;font-weight:500;color:#202124;display:flex;align-items:center;gap:8px;min-width:0}
.gm-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-meta{font-size:.8rem;color:#70757a;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gm-meta .r{color:#202124}
.stars{display:inline-flex;gap:1px}
.stars svg{width:12px;height:12px}
.open{color:#188038}
.closed{color:#d93025}
.gm-btn{width:36px;height:36px;border-radius:50%;border:1px solid #dadce0;display:grid;place-items:center;color:#1a73e8;flex:none}
.gm-btn svg{width:18px;height:18px}
.gm-row.best{background:#f8fbff}
.badge{font-size:.68rem;font-weight:500;color:#1a73e8;background:#e8f0fe;border-radius:4px;padding:2px 6px;white-space:nowrap}
.gm-more{padding:10px 16px;border-top:1px solid #e8eaed;color:#1a73e8;font-size:.85rem;font-weight:500}
.gm-row.you{background:#fef7e0}
.gm-row.you .nm{color:#202124}
.youtag{font-size:.68rem;font-weight:500;color:#b06000;background:#feefc3;border-radius:4px;padding:2px 6px}

/* ---- opções ---- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:16px 8px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);font:500 .82rem/1.25 var(--sans);text-align:center;transition:border-color .15s, background .15s}
.tile svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tile .ic{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.tile:hover{border-color:var(--ink)}
.tile.sel{border-color:var(--ink);background:var(--soft)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:18px 2px;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--ink);font:500 1rem var(--sans);text-align:left;cursor:pointer}
.row small{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:2px}
.row .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;transition:border .15s}
.row:hover .dot{border-color:var(--ink)}
.row.sel .dot{border:6px solid var(--ink)}
.hint{font-size:.88rem;color:var(--muted);padding-left:12px;border-left:2px solid var(--line)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:17px 22px;
  font:600 1rem var(--sans);cursor:pointer;text-decoration:none;background:var(--cta);color:var(--cta-ink);letter-spacing:-.01em}
.btn svg{width:18px;height:18px}
.fine{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;font-size:.8rem;color:var(--muted)}

/* análise */
.analyzing{align-items:center;text-align:center;padding-block:56px;gap:18px}
.spin{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.steps{font-family:var(--mono);font-size:.75rem;color:var(--muted);display:grid;gap:6px}

/* resultado */
.scoreline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.scoreline .num{font-size:3.4rem;font-weight:600;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
.scoreline .num small{font-size:1rem;color:var(--muted);letter-spacing:0}
.meter{flex:1;max-width:180px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.meter .bar{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--m)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.checks i{width:8px;height:8px;border-radius:50%;margin:8px 0 0 4px;display:block}
.checks .x i{background:var(--bad)} .checks .w i{background:var(--warn)} .checks .v i{background:var(--ok)}

.offer{background:var(--soft);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.offer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.offer li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:.95rem}
.offer li svg{width:16px;height:16px;margin-top:4px;stroke:var(--ink);fill:none;stroke-width:2}
.price{display:flex;align-items:baseline;gap:12px}
.price s{color:var(--muted);font-size:.95rem}
.price strong{font-size:2.6rem;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.price strong small{font-size:1rem;font-weight:500;letter-spacing:0;margin-right:2px}
.anchor{font-size:.85rem;color:var(--muted);margin-top:-10px}
.bump{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.bump input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink)}
.bump b{font-weight:600;display:block;font-size:.92rem}
.bump span{font-size:.84rem;color:var(--muted)}
.bump em{font-style:normal;font-weight:600;font-size:.92rem;white-space:nowrap}
.note{font-size:.78rem;color:var(--muted);text-align:center}
.restart{background:none;border:0;color:var(--muted);font:500 .88rem var(--sans);cursor:pointer;align-self:center;text-decoration:underline;text-underline-offset:3px}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <div class="mark"><i></i>Topo do Mapa</div>
    <div class="topr"><span class="steptxt" id="stepTxt" hidden></span><button class="back" id="backBtn" type="button" hidden>Voltar</button></div>
  </div>
  <div class="progress" id="progressWrap" hidden><span id="bar"></span></div>
  <main id="view"></main>
</div>

</button></div>

<style>
.why{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);padding:12px 14px;background:var(--soft);border-radius:12px}
.why b{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:500}
.factor{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.factor i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.fb{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);animation:in .3s ease both}
.fb > i{width:8px;height:8px;border-radius:50%;margin-top:8px;display:block}
.fb.x > i{background:var(--bad)} .fb.w > i{background:var(--warn)} .fb.v > i{background:var(--ok)}
.fb p{font-size:.95rem}
.fb .tip{margin-top:8px;font-size:.88rem;color:var(--muted)}
.fb .tip b{color:var(--ink);font-weight:600}
.factors{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.frow .nm{font-weight:500;font-size:.95rem}
.frow .vl{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.frow .bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.frow .bar span{display:block;height:100%;background:var(--m)}
.frow small{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.wins{display:flex;flex-direction:column;gap:0;counter-reset:w}
.wins li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.wins li::before{counter-increment:w;content:counter(w);width:24px;height:24px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font:500 .75rem var(--mono)}
.wins b{display:block;font-weight:600;font-size:.95rem}
.wins span{font-size:.88rem;color:var(--muted)}
.wins{margin:0;padding:0}
.lead{font-size:1.02rem}
</style>
<style>
.wa-wrap{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
.wa{flex:0 0 82%;max-width:320px;scroll-snap-align:start;background:#efeae2;border-radius:16px;overflow:hidden;color:#111b21;font-family:Roboto, Arial, var(--sans);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wa-top{display:flex;align-items:center;gap:10px;background:#008069;color:#fff;padding:10px 12px}
.wa-av{width:32px;height:32px;border-radius:50%;background:#dfe5e7;color:#54656f;display:grid;place-items:center;font-weight:600;font-size:.85rem}
.wa-top b{display:block;font-size:.9rem;font-weight:500}
.wa-top span{font-size:.72rem;opacity:.85}
.wa-body{display:flex;flex-direction:column;gap:6px;padding:12px 10px 14px}
.wa-msg{align-self:flex-start;max-width:88%;background:#fff;border-radius:8px;padding:6px 8px 4px;font-size:.88rem;line-height:1.35;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.wa-msg.me{align-self:flex-end;background:#d9fdd3}
.wa-msg time{display:block;text-align:right;font-size:.65rem;color:#667781;margin-top:2px}
.wa-img{flex:0 0 82%;max-width:320px;scroll-snap-align:start;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.wa-img img{display:block;width:100%;height:auto}
.proof{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.proof div{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.proof svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.proof b{display:block;font-weight:600;font-size:.95rem}
.proof span{font-size:.88rem;color:var(--muted)}
.src{font-size:.75rem;color:var(--muted)}
</style>
<style>
.hl{color:var(--accent)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top, var(--bg) 70%, transparent);
  padding-top:24px;padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.sticky .btn{max-width:480px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.18)}
body.has-sticky{padding-bottom:120px}
</style>
<style>
:root{--accent-soft:#e8f0fe;--frame:#1c1c1e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent-soft:#16233a;--frame:#2c2c30}}
:root[data-theme="dark"]{--accent-soft:#16233a;--frame:#2c2c30}
.intro h1{font-size:clamp(2.2rem,8.5vw,2.9rem)}
.mini{width:100%;max-width:380px;margin:0 auto}
.mini .gm-map{height:150px}
.mini .gm-row{padding:10px 14px}
.mini .gm-row .nm{font-size:.92rem}
.depo{display:flex;flex-direction:column;gap:26px;scroll-margin-top:24px}
.print{width:100%;max-width:340px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.print figure{margin:0;border-radius:26px;overflow:hidden;border:6px solid var(--frame);box-shadow:0 18px 40px rgba(0,0,0,.18);background:#0b141a}
.print img{display:block;width:100%;height:auto}
.print figcaption{font-size:.82rem;color:var(--muted);text-align:center}
.validado{display:flex;flex-direction:column;gap:12px;background:var(--accent-soft);border-radius:20px;padding:24px 20px;scroll-margin-top:24px}
.validado .seal{display:flex;align-items:center;gap:10px;color:var(--accent);font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.validado .seal svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.validado h3{font-size:1.45rem}
.reveal{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.pre{transform:translateY(36px) scale(.97)}
@media (prefers-reduced-motion: reduce){.reveal,.reveal.pre{transition:none;transform:none}}
.sticky .btn{transition:background .3s, transform .3s}
.sticky .btn.go{background:var(--accent);color:#fff;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.sticky .btn.go{animation:none}}
</style>
<style>
:root{--go:#1e8e3e;--go-ink:#ffffff;--go-soft:#e6f4ea;--glow:rgba(52,199,89,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--go:#34c26a;--go-ink:#05210f;--go-soft:#10291a;--glow:rgba(52,199,89,.55)}}
:root[data-theme="dark"]{--go:#34c26a;--go-ink:#05210f;--go-soft:#10291a;--glow:rgba(52,199,89,.55)}
.sticky .btn.go{background:var(--go);color:var(--go-ink)}
.validado{background:var(--go-soft)}
.validado .seal{color:var(--go)}
.print figure{border-color:var(--frame);box-shadow:0 0 0 1px var(--glow),0 0 22px 2px var(--glow),0 18px 40px rgba(0,0,0,.16);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--glow),0 0 16px 0 var(--glow),0 18px 40px rgba(0,0,0,.16)}50%{box-shadow:0 0 0 1px var(--glow),0 0 30px 6px var(--glow),0 18px 40px rgba(0,0,0,.16)}}
@media (prefers-reduced-motion: reduce){.print figure{animation:none}}
.niches{display:flex;flex-direction:column;gap:14px}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:8px;width:max-content;animation:slide 38s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:44s}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:500;background:var(--surface)}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.track{animation:none;flex-wrap:wrap;width:auto}.marquee{-webkit-mask-image:none;mask-image:none}}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.big{grid-template-columns:1fr}}

const FACTORS = {

const state = {};       // respostas
let history = [];       // chaves das perguntas já respondidas
const T = () => state.tipo || TIPOS[8];

/* Cada pergunta: factor (opcional), why (você sabia), opts com pts, tom (x ruim, w atenção, v bom), fb e tip (o que fazer) */
const Q = {
  tipo: () => ({ title:"Qual é o seu negócio?", tiles:true,
    opts: TIPOS.map(t=>({v:t.id, label:t.label})),

  presenca: () => ({ factor:"info",
    title:"Pesquise o nome da sua empresa no Google. O que aparece?",
    why:"O quadro com mapa, telefone e horário é o Perfil da Empresa no Google, o antigo Google Meu Negócio. Ele é gratuito, e qualquer dono pode criar ou reivindicar o seu.",

      {v:"naosei", label:"Não sei", pts:0, tom:"w",
        fb:"Vale fazer esse teste agora, pelo celular.", tip:"Use uma aba anônima: assim você vê o que um cliente novo vê, sem o histórico do seu celular."}
    ],
    next: v => (v==="topo"||v==="meio") ? "posicao" : "atende" }),

  atende: () => ({
    title:"Onde você atende os seus clientes?",
    why:"O Google trata de um jeito quem tem porta aberta e de outro quem vai até o cliente. Os dois podem aparecer no mapa.",
    opts:[
      {v:"ponto", label:"No meu endereço", small:"Loja, consultório, oficina, salão", tom:"v",
        fb:"Com endereço físico, você pode aparecer para todo mundo que busca perto de você.", tip:"Uma foto clara da fachada ajuda o cliente a te reconhecer na rua."},
      {v:"casa", label:"Vou até o cliente", small:"Atendo bairros ou uma região", tom:"v",
        fb:"Você pode aparecer no mapa sem mostrar o endereço da sua casa, cadastrando só a área de atendimento.", tip:"Liste os bairros ou cidades que você atende de verdade."},
      {v:"misto", label:"Vendo online, mas também entrego ou atendo na minha cidade", small:"Delivery, retirada, visita ou consulta presencial", tom:"v",
        fb:"Você pode ter perfil no Google cadastrando a sua área de atendimento."},
      {v:"online", label:"100% online, sem nenhum contato presencial", small:"Envio pelos Correios ou produto digital", tom:"w",

    ],
    next: v => v==="online" ? "RESULT" : "concorrente" }),

  concorrente: () => ({
    title:`Pesquise “${T().termo}”. Quantas avaliações tem o primeiro colocado?`,
    why:"O primeiro do mapa mostra o tamanho do desafio no seu bairro. O número de avaliações dele é uma boa meta inicial para você.",

      {v:"poucas", label:"Menos de 20", tom:"v", fb:"Concorrência fraca. Com um perfil bem feito e algumas avaliações, você entra na disputa rápido."},

  posicao: () => ({ factor:"rel",

      {v:"naotestei", label:"Não consigo testar agora", pts:3, tom:"w",
        fb:"Sem medir, não dá para saber se uma mudança funcionou.", tip:"Faça a busca pelo celular, estando perto do seu negócio."}
    ],
    next: () => "categoria" }),

  categoria: () => ({ factor:"rel",
    title:"Qual é a categoria principal do seu perfil?",
    why:"A categoria principal diz ao Google o que o seu negócio é. “Salão de beleza” e “Barbearia”, por exemplo, aparecem para buscas diferentes.",

      {v:"exata", label:"A categoria exata do meu serviço", pts:15, tom:"v",

      {v:"generica", label:"Uma categoria genérica", small:"Ex.: Empresa, Loja, Prestador de serviço", pts:4, tom:"x",

      {v:"naosei", label:"Não sei qual está", pts:2, tom:"w",

  avaliacoes: () => ({ factor:"dest",

  nota: () => ({ factor:"dest",

      {v:"39", label:"Abaixo de 4,0", pts:2, tom:"x", fb:"Abaixo de 4, você pode sumir para quem filtra por nota.", tip:"A saída é volume: muitas avaliações novas de clientes satisfeitos diluem as ruins."},
      {v:"naosei", label:"Não sei", pts:3, tom:"w", fb:"A nota aparece logo abaixo do nome, no seu perfil.", tip:"Confira a nota e leia as 3 avaliações mais recentes. É o que o cliente lê primeiro."}

  responde: () => ({ factor:"dest",
    title:"Você responde às avaliações?",
    why:"O próprio Google recomenda responder às avaliações. A resposta mostra ao cliente que tem alguém cuidando do negócio.",
    opts:[
      {v:"sempre", label:"Respondo todas", pts:10, tom:"v", fb:"Ótimo. Responder com o nome do serviço feito ajuda também a reforçar do que o seu negócio trata."},
      {v:"asvezes", label:"Algumas", pts:5, tom:"w", fb:"Responder só às vezes passa a impressão de descuido.", tip:"Separe 10 minutos por semana para responder todas, inclusive as antigas."},
      {v:"nunca", label:"Nunca respondi", pts:0, tom:"x", fb:"Avaliação sem resposta passa a imagem de negócio abandonado, principalmente as negativas.", tip:"Comece pelas negativas: agradeça, peça desculpas pelo que aconteceu e diga o que mudou."}

    next: () => "fotos" }),

    why:"O Google recomenda fotos e vídeos para apresentar o negócio. A foto é a primeira coisa que o cliente vê, antes de ler qualquer texto.",
    opts:[
      {v:"30+", label:"Mais de 30", pts:10, tom:"v", fb:"Muito bom. Fotos recentes contam ainda mais.", tip:"Suba algumas fotos novas todo mês."},
      {v:"10-30", label:"Entre 10 e 30", pts:6, tom:"w", fb:"Razoável. Faltam fotos de equipe, ambiente ou serviços prontos?", tip:"Suba algumas fotos novas todo mês. Fotos recentes contam mais."},
      {v:"<10", label:"Menos de 10", pts:2, tom:"x", fb:"Poucas fotos fazem o perfil parecer abandonado.", tip:"Tire 10 fotos hoje: fachada, ambiente por dentro, equipe trabalhando e seus melhores serviços."},
      {v:"0", label:"Só o logo ou nenhuma", pts:0, tom:"x", fb:"Sem fotos, o cliente não tem como imaginar o seu atendimento.", tip:"Tire 10 fotos hoje: fachada, ambiente por dentro, equipe trabalhando e seus melhores serviços."}
    ],
    next: () => (state.presenca==="topo"||state.presenca==="meio") ? "info" : "objetivo" }),

  info: () => ({ factor:"info",
    title:"Horário, telefone, WhatsApp e endereço estão completos e corretos?",
    why:"Horário errado gera cliente na porta fechada e avaliação ruim. O Google também usa a precisão das informações para decidir quem mostrar.",
    opts:[
      {v:"tudo", label:"Sim, tudo certo", pts:10, tom:"v", fb:"Ótimo. Lembre de cadastrar o horário especial de feriados."},
      {v:"parcial", label:"Alguma coisa está faltando ou desatualizada", pts:4, tom:"x", fb:"Cliente que encontra a porta fechada raramente volta, e às vezes deixa uma avaliação ruim.", tip:"Revise horário, telefone e link do WhatsApp, e já cadastre o horário especial dos feriados de fim de ano."},
      {v:"naosei", label:"Não sei", pts:2, tom:"w", fb:"Vale conferir: às vezes o Google ou outras pessoas sugerem alterações no seu perfil.", tip:"Abra o perfil e confira horário, telefone e site como se fosse um cliente."}
    ],
    next: () => "servicos" }),

  servicos: () => ({ factor:"rel",
    title:"Você cadastrou uma descrição e a lista de serviços ou produtos no perfil?",
    why:"Descrição, serviços e produtos ajudam o Google a entender para quais buscas você é relevante, além da categoria.",
    opts:[
      {v:"sim", label:"Sim, os dois completos", pts:10, tom:"v", fb:"Perfeito. Use as palavras que o cliente usa, não termos técnicos."},
      {v:"parcial", label:"Só um deles ou incompleto", pts:5, tom:"w", fb:"Metade do caminho. Cada serviço cadastrado é mais uma chance de aparecer.", tip:"Cadastre cada serviço separadamente, com o nome que o cliente digitaria."},
      {v:"nao", label:"Não, nunca mexi nisso", pts:0, tom:"x", fb:"Você está deixando o Google adivinhar o que você faz.", tip:"Escreva uma descrição de 3 linhas: o que você faz, para quem e em qual bairro, do jeito que o cliente falaria."},
      {v:"naosabia", label:"Não sabia que dava", pts:0, tom:"x", fb:"A maioria dos donos não sabe. Por isso é uma vantagem fácil de conquistar.", tip:"Escreva uma descrição de 3 linhas: o que você faz, para quem e em qual bairro, do jeito que o cliente falaria."}
    ],
    next: () => "posts" }),

  posts: () => ({ factor:"dest",
    title:"Com que frequência você publica novidades, ofertas ou fotos no perfil?",
    why:"Postagens ficam visíveis no seu perfil e mostram ao cliente, e ao Google, que o negócio está ativo.",
    opts:[
      {v:"semanal", label:"Toda semana", pts:10, tom:"v", fb:"Excelente. Poucos negócios mantêm essa constância."},
      {v:"mensal", label:"Uma vez por mês ou menos", pts:5, tom:"w", fb:"Já é algo. Uma rotina semanal curta faz diferença.", tip:"Escolha um dia fixo da semana e publique uma foto com uma novidade ou oferta."},
      {v:"nunca", label:"Nunca publiquei", pts:0, tom:"x", fb:"Você está deixando de usar um espaço gratuito de divulgação no próprio Google.", tip:"Publique hoje uma foto com a oferta da semana. Leva 5 minutos."}
    ],
    next: () => "objetivo" }),

  objetivo: () => ({
    title:"O que você mais quer agora?",
    opts:[
      {v:"ligacoes", label:"Mais ligações e mensagens no WhatsApp"},
      {v:"visitas", label:"Mais clientes chegando até mim"},
      {v:"confianca", label:"Passar mais confiança que o concorrente"}
    ],
    next: () => "RESULT" })
};

const PATH_PERFIL = ["tipo","presenca","posicao","categoria","avaliacoes","nota","responde","fotos","info","servicos","posts","objetivo"];
const PATH_SEM = ["tipo","presenca","atende","concorrente","fotos","objetivo"];
function totalSteps(){
  if(state.presenca==="nao"||state.presenca==="naosei") return PATH_SEM.length;
  return state.avaliacoes==="0" ? PATH_PERFIL.length-2 : PATH_PERFIL.length;
}

const sticky = document.getElementById("sticky"); const stepTxt = document.getElementById("stepTxt");
document.getElementById("stickyBtn").onclick=()=>stickyClick();
const view = document.getElementById("view"), bar = document.getElementById("bar"),
      backBtn = document.getElementById("backBtn"), progressWrap = document.getElementById("progressWrap");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ---------- cartão estilo Google Maps ---------- */
const STAR = f => `<svg viewBox="0 0 24 24"><path fill="${f}" d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.4 14l-1.6 7z"/></svg>`;
function starsHTML(r){ let h=""; for(let i=1;i<=5;i++){ h+=STAR(r>=i-0.25?"#fbbc04":"#dadce0"); } return `<span class="stars">${h}</span>`; }

function drawMaps(){
  document.querySelectorAll(".gm-map canvas").forEach(cv=>{
    const rect = cv.getBoundingClientRect(); if(!rect.width) return;
    const dpr = window.devicePixelRatio||1, w=rect.width, h=rect.height;
    cv.width=w*dpr; cv.height=h*dpr;
    const c=cv.getContext("2d"); c.scale(dpr,dpr);
    c.fillStyle="#eef0f2"; c.fillRect(0,0,w,h);
    c.fillStyle="#cdebd5"; c.beginPath(); c.roundRect ? c.roundRect(w*.62,h*.3,w*.2,h*.3,8) : c.rect(w*.62,h*.3,w*.2,h*.3); c.fill();
    c.fillStyle="#aadaff"; c.beginPath(); c.moveTo(0,h*.9); c.bezierCurveTo(w*.25,h*.8,w*.45,h*1.02,w*.7,h*.92); c.lineTo(w*.7,h); c.lineTo(0,h); c.fill();
    c.fillStyle="#e3e6e9";
    for(let x=-10;x<w;x+=58){ for(let y=-6;y<h;y+=44){ if(x>w*.6&&x<w*.82&&y>h*.25&&y<h*.6) continue; c.fillRect(x+6,y+6,46,32); } }
    c.strokeStyle="#ffffff"; c.lineWidth=5;
    for(let x=-10;x<w;x+=58){ c.beginPath(); c.moveTo(x+3,0); c.lineTo(x+3,h); c.stroke(); }
    for(let y=-6;y<h;y+=44){ c.beginPath(); c.moveTo(0,y+3); c.lineTo(w,y+3); c.stroke(); }
    c.strokeStyle="#f9d36b"; c.lineWidth=7; c.beginPath(); c.moveTo(0,h*.72); c.lineTo(w,h*.48); c.stroke();
    c.strokeStyle="#fde9a8"; c.lineWidth=3; c.beginPath(); c.moveTo(0,h*.72); c.lineTo(w,h*.48); c.stroke();
    c.fillStyle="#8a8f96"; c.font="500 10px Roboto, Arial, sans-serif"; c.save(); c.translate(w*.06,h*.7); c.rotate(-Math.atan((h*.24)/w)); c.fillText("Av. Brasil",0,-6); c.restore();
    c.fillStyle="#3c7a4f"; c.fillText("Praça",w*.66,h*.46);
    const names = JSON.parse(cv.dataset.names||"[]"), best=+cv.dataset.best;
    const pos=[[.3,.55],[.6,.8],[.86,.7],[.14,.86]];
    names.forEach((n,i)=>{ if(i!==best) pin(c,w*pos[i][0],h*pos[i][1],false); });
    if(best>=0){ const [px,py]=pos[best]; pin(c,w*px,h*py,true); chip(c,w*px,h*py,names[best],JSON.parse(cv.dataset.r)[best],w); }
  });
}
function pin(c,x,y,big){
  const s=big?1.35:1, r=8*s;
  c.save(); c.shadowColor="rgba(0,0,0,.25)"; c.shadowBlur=4; c.shadowOffsetY=1;
  c.fillStyle="#ea4335"; c.beginPath(); c.arc(x,y-r*1.6,r,Math.PI*0.85,Math.PI*0.15,false); c.lineTo(x,y); c.closePath(); c.fill(); c.restore();
  c.fillStyle="#a50e0e"; c.beginPath(); c.arc(x,y-r*1.6,r*.38,0,Math.PI*2); c.fill();
}
function chip(c,x,y,name,r,w){
  const nota=`${r.toFixed(1).replace(".",",")} ★`;
  c.font="500 11px Roboto, Arial, sans-serif";
  const tw=c.measureText(name+"  "+nota).width+16;
  let bx=x+12; if(bx+tw>w-6) bx=x-12-tw; const by=y-34;
  c.save(); c.shadowColor="rgba(0,0,0,.2)"; c.shadowBlur=6; c.fillStyle="#fff";
  c.beginPath(); c.roundRect ? c.roundRect(bx,by,tw,22,11) : c.rect(bx,by,tw,22); c.fill(); c.restore();
  c.textBaseline="middle"; c.fillStyle="#202124"; c.fillText(name,bx+8,by+11);
  c.fillStyle="#e37400"; c.fillText(nota, bx+8+c.measureText(name+"  ").width, by+11);
}

let unlocked=false;
function initLock(){
  unlocked=false;
  const b=document.getElementById("stickyBtn");
  b.classList.remove("open","just","shake"); b.setAttribute("aria-disabled","true");
  document.getElementById("lockTxt").innerHTML="Role a página para liberar sua avaliação <b>GRATUITA</b>";
  updateLock();
}
function scrollProgress(){
  const max=document.documentElement.scrollHeight-window.innerHeight;
  return max>0 ? Math.min(1, window.scrollY/max) : 1;
}
function updateLock(){
  if(sticky.hidden || unlocked) return;
  const pr=scrollProgress(), goal=.9, pc=Math.min(100,Math.round(pr/goal*100));
  document.getElementById("lockFill").style.width=pc+"%";
  document.getElementById("lockPct").textContent=pc+"%";
  if(pr>=goal) unlock();
}
function unlock(){
  unlocked=true;
  const b=document.getElementById("stickyBtn");
  b.classList.add("open","just"); b.setAttribute("aria-disabled","false");
  document.getElementById("lockTxt").innerHTML="Fazer minha avaliação <b>GRATUITA</b>";
  setTimeout(()=>b.classList.remove("just"),700);
}
function stickyClick(){
  const b=document.getElementById("stickyBtn");
  if(unlocked){ stopAuto(); track("Lead",{content_name:"diagnostico"}); go("tipo"); return; }
  b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  pauseAuto(1800);
  window.scrollBy({top: Math.round(window.innerHeight*.8), behavior: RM?"auto":"smooth"});
}
window.addEventListener("scroll",()=>updateLock(),{passive:true});

/* ---- revelar ao rolar e trocar o botão ---- */
let io;
function watchIntro(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.remove("pre"); }
  }),{threshold:.25});
  view.querySelectorAll(".reveal").forEach(el=>io.observe(el));
}

/* ---- rolagem automática lenta ---- */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let autoOn=false, autoPausedUntil=0, autoRaf=0, autoAcc=0;
function startAuto(){
  stopAuto(); if(RM) return;
  autoOn=true; autoPausedUntil=performance.now()+2200;
  const step=t=>{ if(!autoOn) return;
    if(t>autoPausedUntil){ autoAcc+=0.55; if(autoAcc>=1){ const d=Math.floor(autoAcc); autoAcc-=d; window.scrollBy(0,d); } 
      if(window.innerHeight+window.scrollY >= document.documentElement.scrollHeight-2){ autoOn=false; return; } }
    autoRaf=requestAnimationFrame(step); };
  autoRaf=requestAnimationFrame(step);
}
function pauseAuto(ms){ autoPausedUntil=performance.now()+ms; }
function stopAuto(){ autoOn=false; cancelAnimationFrame(autoRaf); }
["wheel","touchstart","keydown","pointerdown"].forEach(ev=>window.addEventListener(ev,()=>{ if(autoOn) pauseAuto(4000); },{passive:true}));

}

function answered(){ return [...history, "objetivo"].filter((k,i,a)=>a.indexOf(k)===i && state[k]!==undefined && Q[k]); }
function factorScores(){
  const f={rel:[0,0],dest:[0,0],info:[0,0]};
  answered().forEach(k=>{ const q=Q[k](); if(!q.factor) return;
    const max=Math.max(...q.opts.map(o=>o.pts||0)); const o=q.opts.find(o=>o.v===state[k]);
    f[q.factor][0]+= (o&&o.pts)||0; f[q.factor][1]+=max; });
  if(state.avaliacoes==="0"){ f.dest[1]+=20; } // nota e respostas contam como zero
  return f;
}
function totalScore(f){
  let a=0,b=0; for(const k in f){a+=f[k][0];b+=f[k][1];}
  return b? Math.round(a/b*100) : 0;
}
function wins(){
  const L=[];
  answered().forEach(k=>{ const q=Q[k](); const o=q.opts.find(o=>o.v===state[k]); if(o&&o.tip&&(o.tom==="x"||o.tom==="w")) L.push({tom:o.tom, k, tip:o.tip, fator:q.factor}); });
  L.sort((a,b)=>(a.tom==="x"?0:1)-(b.tom==="x"?0:1));
  const seen=new Set(); return L.filter(w=>{ if(seen.has(w.tip)) return false; seen.add(w.tip); return true; }).slice(0,3);
}

/* ---------- rodapé legal, rastreamento com consentimento e UTMs ---------- */
function safeUrl(u){ try{ const x=new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.toString() : ""; }catch(e){ return ""; } }
function rodape(){
  const v=CONFIG.vendedor||{};
  const links=[v.privacidade&&safeUrl(v.privacidade)?`<a href="${esc(safeUrl(v.privacidade))}" target="_blank" rel="noopener">Política de privacidade</a>`:"",
    v.termos&&safeUrl(v.termos)?`<a href="${esc(safeUrl(v.termos))}" target="_blank" rel="noopener">Termos de uso</a>`:"",
    v.email?`<a href="mailto:${esc(v.email)}">${esc(v.email)}</a>`:""].filter(Boolean).join(" · ");
  return `<footer class="legal">
    ${v.nome?`<p><b>${esc(v.nome)}</b>${v.cnpj?` · CNPJ ${esc(v.cnpj)}`:""}</p>`:""}
    ${links?`<p>${links}</p>`:""}
    <p>Material educativo independente, sem vínculo com o Google. Google e Perfil da Empresa no Google são marcas do Google LLC. O mapa desta página é uma ilustração.</p>
    <p>Os resultados dependem da aplicação, da concorrência e da localização de quem pesquisa. Nenhuma posição é garantida.</p>
  </footer>`;
}
const UTM_KEYS=["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid","gclid","src","sck"];
function withUtm(link){
  const s=safeUrl(link); if(!s) return "";
  try{ const u=new URL(s), here=new URLSearchParams(location.search);
    UTM_KEYS.forEach(k=>{ if(here.get(k) && !u.searchParams.has(k)) u.searchParams.set(k, here.get(k)); });
    return u.toString(); }catch(e){ return s; }
}
function track(ev, params){
  try{ if(window.fbq) fbq("track", ev, params||{}); }catch(e){}
  try{ if(window.gtag) gtag("event", ev, params||{}); }catch(e){}
}
function loadTrackers(){
  const r=CONFIG.rastreamento||{};
  if(r.metaPixel && /^\d{6,20}$/.test(r.metaPixel)){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", r.metaPixel); fbq("track","PageView");
  }
  if(r.googleTag && /^(G|AW)-[A-Z0-9]+$/.test(r.googleTag)){
    const s=document.createElement("script"); s.async=true; s.src="https://www.googletagmanager.com/gtag/js?id="+r.googleTag; document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments);}; gtag("js",new Date()); gtag("config", r.googleTag);
  }
}
function consent(){
  const r=CONFIG.rastreamento||{}; if(!r.metaPixel && !r.googleTag) return;
  let c=null; try{ c=localStorage.getItem("tdm_consent"); }catch(e){}
  if(c==="sim") return loadTrackers(); if(c==="nao") return;
  const d=document.createElement("div"); d.className="cookie"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Aviso de cookies");
  d.innerHTML=`<p>Usamos cookies para medir o desempenho dos nossos anúncios.${CONFIG.vendedor&&safeUrl(CONFIG.vendedor.privacidade||"")?` <a href="${esc(safeUrl(CONFIG.vendedor.privacidade))}" target="_blank" rel="noopener">Saiba mais</a>`:""}</p><div><button type="button" data-c="nao">Recusar</button><button type="button" data-c="sim" class="ok">Aceitar</button></div>`;
  d.querySelectorAll("button").forEach(b=>b.onclick=()=>{ try{ localStorage.setItem("tdm_consent", b.dataset.c); }catch(e){} d.remove(); if(b.dataset.c==="sim") loadTrackers(); });
  document.body.appendChild(d);
}

function problems(p){
  const L=[];
  if(p==="invisivel") L.push({t:"Sem perfil no Google: você não aparece em nenhuma busca do mapa", d:`Quem procura “${T().termo}” só encontra os concorrentes.`, sev:"x"});
  answered().forEach(k=>{ const q=Q[k](); const o=q.opts.find(o=>o.v===state[k]);
    if(o && (o.tom==="x"||o.tom==="w") && PROB[k] && k!=="atende") L.push({t:PROB[k], d:o.fb, sev:o.tom}); });
  L.sort((a,b)=>(a.sev==="x"?0:1)-(b.sev==="x"?0:1));
  return L;
}

/* o mapa encolhe e sai conforme a página desce no resultado */
function mapCollapse(){
  const el=document.querySelector("#rmap .gm-map"), wrap=document.getElementById("rmap");
  if(!el||!wrap) return;
  const H=el.offsetHeight;
  const top0 = wrap.getBoundingClientRect().top + window.scrollY;
  const on=()=>{
    if(view.dataset.key!=="RESULT"){ window.removeEventListener("scroll",on); return; }
    const d=Math.max(0, window.scrollY - (top0 - window.innerHeight*.35));
    const h=Math.max(0, H - d*.9);
    el.style.height=h+"px";
    wrap.style.transform = RM ? "" : `scale(${1 - Math.min(d,240)/240*0.06})`;
  };
  window.addEventListener("scroll",on,{passive:true}); on();
}
